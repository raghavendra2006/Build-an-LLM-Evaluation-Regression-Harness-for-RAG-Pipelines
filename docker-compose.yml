version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: rag_qdrant_vectordb
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  eval_harness:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_eval_harness
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your_openai_api_key_here}
      - VECTOR_DB_HOST=qdrant
      - VECTOR_DB_PORT=6333
    volumes:
      - ./results:/app/results
